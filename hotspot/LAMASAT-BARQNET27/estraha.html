<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>عرض المحتوى • بدون Splash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root{
      --bg: #000;          /* خلفية المسرح */
      --text: #ffffff;     /* لون النص */
      --border: rgba(255,255,255,.18);
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", Tahoma, Arial;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh; /* مهم داخل WebView */
      background: var(--bg);
    }

    iframe {
      position: absolute;
      inset: 0;
      border: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    /* زر ملء الشاشة */
    #fullscreenBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      z-index: 4;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <button id="fullscreenBtn">⛶ ملء الشاشة</button>

  <div id="app">
    <!-- الخلفية الفعلية فقط بدون أي Splash -->
    <iframe
      id="videoFrame"
      src="http://10.10.10.10:8096/web/index.html"
      allowfullscreen
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <script>
    const fsBtn  = document.getElementById('fullscreenBtn');

    // زر ملء الشاشة فقط
    fsBtn.addEventListener('click', () => {
      const el = document.documentElement;
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
        return;
      }
      (el.requestFullscreen ||
       el.webkitRequestFullscreen ||
       el.msRequestFullscreen ||
       el.mozRequestFullScreen)?.call(el);
    });
  </script>
</body>
</html>
